[build-system]
build-backend = "flit_gettext.scm"
requires = [ "flit-core>=3.2", "flit-gettext[scm]", "wheel" ]

[project]
name = "django-vies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [
  "django>=4.2",
  "retrying>=1.1",
  "zeep>=2.5",
]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "vies/_version.py"

[tool.flit]
[tool.flit.module]
name = "vies"

[tool.ruff]
target-version = "py314"
line-length = 88
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]
isort.known-first-party = [ "measurement", "tests" ]

[tool.pytest]
[tool.pytest.ini_options]
norecursedirs = [ ".eggs", "env", "venv" ]
addopts = "--cov=vies"
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "." ]
omit = [
  "*/migrations/*",
  "*/test_*.py",
  "*/tests/*",
  ".tox",
]
[tool.coverage.report]
show_missing = true

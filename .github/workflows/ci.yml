name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt install -y gettext
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from build pyproject-build --sdist --wheel
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
  pytest:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.14"
        django-version:
          - "5.2"
          - "6.0"
          - "6.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt install -y gettext
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --with=pytest-github-actions-annotate-failures --with django~=${{ matrix.django-version }}.0 pytest --cov=vies --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: py${{ matrix.python-version }}-dj${{ matrix.django-version }}
